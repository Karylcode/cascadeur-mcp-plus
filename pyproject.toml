[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cascadeur-mcp-plus"
dynamic = ["version"]
description = "MCP server that lets AI agents drive Cascadeur: Python, scene inspection, screenshots and full UI control."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

# Nothing to install: the in-app server runs on Cascadeur's bundled Python 3.11 (PySide6 included),
# and the proxy and CLI use only the standard library. A normal Python runs "cascadeur-mcp-plus
# serve" outside Cascadeur; Cascadeur itself loads the same package through start_mcp_plus.py.

[project.scripts]
cascadeur-mcp-plus = "cascadeur_mcp_plus_cli.main:main"

[tool.setuptools]
# Cascadeur executes cascadeur_mcp_plus_runtime/start_mcp_plus.py, which adds only that
# directory (not site-packages) to sys.path so the host Python's compiled packages cannot
# shadow Cascadeur's own modules. cascadeur_mcp_plus/ is installed inside the runtime
# directory through the package-dir mapping below. proxy.py lives in the CLI package, so the
# wheel installs no top-level "proxy" module (that name collides with the "proxy.py"
# distribution on PyPI); the repository's root proxy.py is a checkout-only launcher.
packages = [
    "cascadeur_mcp_plus_cli",
    "cascadeur_mcp_plus_runtime",
    "cascadeur_mcp_plus_runtime.cascadeur_mcp_plus",
    "cascadeur_mcp_plus_runtime.cascadeur_mcp_plus.tools",
]

[tool.setuptools.package-dir]
"cascadeur_mcp_plus_runtime.cascadeur_mcp_plus" = "cascadeur_mcp_plus"
"cascadeur_mcp_plus_runtime.cascadeur_mcp_plus.tools" = "cascadeur_mcp_plus/tools"

[tool.setuptools.dynamic]
version = { attr = "cascadeur_mcp_plus_runtime.cascadeur_mcp_plus.version.VERSION" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# Long tool descriptions and messages are clearer unwrapped; the formatter handles code lines.
ignore = ["E501", "UP006", "UP007", "UP035"]
