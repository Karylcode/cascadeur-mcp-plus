name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install ruff==0.17.2
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    # proxy.py is used on Windows next to Cascadeur, so test it there.
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Standard library only: nothing to install.
      - name: Run tests
        run: python -m unittest discover -s tests -v

  proxy:
    name: Proxy and CLI (${{ matrix.os }}, Python ${{ matrix.python-version }})
    # The stdio proxy and the CLI run next to Cascadeur on every platform it ships for. These
    # jobs run the tests that need no Cascadeur on macOS and Linux (T55); the Windows matrix
    # above covers the in-app package and everything else.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Standard library only: nothing to install.
      - name: Run proxy and CLI tests
        run: |
          python -m unittest discover -s tests -p "test_proxy.py" -v
          python -m unittest discover -s tests -p "test_cli.py" -v
          python -m unittest discover -s tests -p "test_server.py" -v
          python -m unittest discover -s tests -p "test_live_gating.py" -v
          python -m unittest discover -s tests -p "test_autostart.py" -v
          python -m unittest discover -s tests -p "test_platform.py" -v
